services:
  spark-master:
    image: apache/spark:3.5.8-python3
    container_name: spark-master
    user: root
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./results:/results

  spark-worker-1:
    image: apache/spark:3.5.8-python3
    container_name: spark-worker-1
    user: root
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8081 --memory 4G --cores 2
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./results:/results

  spark-worker-2:
    image: apache/spark:3.5.8-python3
    container_name: spark-worker-2
    user: root
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --webui-port 8082 --memory 4G --cores 2
    ports:
      - "8082:8082"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./results:/results

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    container_name: jupyter
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "8888:8888"
    volumes:
      - ./:/home/jovyan/work
      - ./data:/data
      - ./models:/models
      - ./results:/results
    working_dir: /home/jovyan/work
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
